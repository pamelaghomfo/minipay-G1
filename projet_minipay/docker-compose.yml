# MiniPay : quatre services. Noms imposés (le chaos_runner arrête et redémarre un service par son nom).
services:
  gateway:
    build: .
    command: python gateway.py
    ports: ["8080:8080"]
    environment:
      COMPTE_URL: http://compte:5001
      PAIEMENT_URL: http://paiement:5002
      NOTIF_URL: http://notification:5003
    depends_on: [compte, paiement, notification]
  compte:
    build: .
    command: python compte.py
    environment: { DB: /data/compte.db, PORT: "5001" }
    volumes: ["compte_data:/data"]
  paiement:
    build: .
    command: python paiement.py
    environment:
      DB: /data/paiement.db
      PORT: "5002"
      COMPTE_URL: http://compte:5001
      NOTIF_URL: http://notification:5003
    volumes: ["paiement_data:/data"]
  notification:
    build: .
    command: python notification.py
    environment: { LOG: /data/notifications.log, PORT: "5003" }
    volumes: ["notif_data:/data"]
volumes: { compte_data: {}, paiement_data: {}, notif_data: {} }
